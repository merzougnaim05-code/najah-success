    <rect x="553" y="252" width="22" height="34" rx="12" fill="#3E2A17"/>
    <circle cx="562" cy="288" r="11" fill="#3E2A17"/>
    <circle cx="489" cy="276" r="3.4" fill="#3E2A17"/>
