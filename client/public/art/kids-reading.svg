    <line x1="-29" y1="-29" x2="-38" y2="-38" stroke="#FFD93D" stroke-width="7" stroke-linecap="round"/>
    <line x1="29" y1="-29" x2="38" y2="-38" stroke="#FFD93D" stroke-width="7" stroke-linecap="round"/>
    <line x1="-29" y1="29" x2="-38" y2="38" stroke="#FFD93D" stroke-width="7" stroke-linecap="round"/>
    <line x1="29" y1="29" x2="38" y2="38" stroke="#FFD93D" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-9" cy="-5" r="3.4" fill="#C77700"/>
    <circle cx="9" cy="-5" r="3.4" fill="#C77700"/>
