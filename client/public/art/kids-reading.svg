    <rect x="466" y="336" width="84" height="78" rx="28" fill="#35C2EE"/>
    <rect x="466" y="336" width="84" height="14" rx="7" fill="#62D2F5"/>
    <circle cx="504" cy="268" r="35" fill="#3E2A17"/>
